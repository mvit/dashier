  <!-- ═══ EDITING GUIDE (for LLMs and humans) ═══
  The dashboard is the JSON in #dashier-doc below; the app renders it on load. Keep it valid JSON and write every "<" in
  it as \u003c. #preview in the URL hides the editor, #<page id> opens a page, #fit fits the page to the window (#preview,fit). Leave the app code (base85(gzip(JS))) alone:
  this guide describes everything a document needs, so decoding it never helps.

  doc      { format:"dashier", version:1, title, theme?, canvas?:{width, height} (fixed page size in px, default 1440×810;
    viewers zoom and pan, never reflow; it grows taller to fit), sources:{<id>:Source}, pages:[Page],
    filters?:[Filter] (every page), relationships?:[Relationship], measures?:[Measure] }
  Source   { format:"csv"|"json", encoding:"gzip+base64", structure:[{name, type, sortBy?}], payload }
    type: string|float|int|uint|datetime|boolean (datetime: ISO "2024-01-03[T14:05]", also 1/3/2024, "Jan 3, 2024").
    sortBy: another column whose values order this one's (month names by month number) on axes, legends, matrices,
    slicers. payload = base64(gzip(CSV with header | JSON array of rows)); in Python: base64.b64encode(gzip.compress(
    csv_bytes)).decode(), back with gzip.decompress(base64.b64decode(payload)).
  Relationship { from:{table, field}, to:{table, field}, cardinality?, crossFilter?:"both" }: from = a fact (many side),
    to = a dimension (one side; a repeated key matches its first row). cardinality: "many-to-one" (default) |
    "one-to-one" (both are lookups; filters flow both ways) | "many-to-many" (no lookups: a row joins every match). Keys match by value, text ignoring case. Filters flow
    to → from and on through further relationships ("both": also back; a filter on the linked field crosses either way).
    Visuals use any connected table's fields as "table.field" (a row with no match shows them blank), and its measures.
  Page     { id, title, elements:[Element], filters?:[Filter] }
  Element  { id, type, x 0-11, y, w 1-12, h (12-column grid, rows), title?, sourceId? (its table, usually a fact; its own
    fields are plain names), filters?:[Filter] }
    chart    chartType:"bar"|"hbar"|"line"|"area"|"combo"|"scatter"|"pie"|"donut"|"radar"|"treemap"|"sankey"|"gauge",
      mapping:{x, y, group?, line?, detail?}, summary?:Value (y; lineSummary?:Value the combo's line).
      bar/hbar/line/area: x category, y value, group series · pie/donut: x slice · radar: x axis, group series ·
      treemap: x leaf, group parent · sankey: x source, group target, y flow · gauge: y · combo: y columns, group
      series, line on one axis · scatter: x, y numbers or measures, group color, detail
      one point per value (x by xSummary?, y by summary). dateParts?:{x?, group?, detail?: DatePart} (oldest first).
      options:{showLegend, legendPosition?:"bottom"|"top"|"right"|"left", showValues, yAxisLabel, xAxisLabel, min, max
      (radar: center and rim), format?:Format, units?:Units (axis and labels), sort?:"value-desc"|"value-asc"|"label",
      topN?, stack?:"stacked"|"percent" (combo: stacked; lines: percent), valueAxis?:false, categoryAxis?:false,
      gridlines?:false, colors?:{<series, slice or category name>: color}, varyColors? (one series of bars),
      barWidth? (0.2-1, default 0.7), barRadius? (px), lineWidth? (px), markers?:true|false,
      refLines?:[{value | stat:"average"|"median"|"min"|"max" (of the first series), label?, color?}],
      donutHole? (0.2-0.85)}
    card     aggregation:{method:Aggregate, field}, format?, units?, subtitle? (static), staticValue?, compare?:Compare,
      callout?:{size? (px), color?, align?:"left"}
    table    columns?:[{field, label, align?, format?:Format|"date", units?, aggregate?, showAs?:"percent-of-total",
      datePart?, cond?:"scale"|"bars"}] (default all; with any column aggregated, one row per combination of the
      others), totals?:false, grid?:Grid
  Grid     { density?:"compact"|"roomy", banded?:true, lines?:"both"|"none", textSize? (px) } (tables and matrices)
    matrix   rows?:[{field, datePart?}] (hierarchy, outer first), columns?:[{field, datePart?}], values?:[{field, label?,
      format?, units?, cond?} + Value], subtotals?:false, totals?:false|"row"|"column" (keep only that one), grid?:Grid
    slicer   field (of sourceId), style?:"list"|"dropdown"|"tiles"|"range", single?, datePart?, selection?:{values?|min?,
      max?|from?, to?}. The page's other visuals follow the pick. Default style: range for numbers, else list.
    markdown content (Markdown + Mustache templates over the filtered data), textSize? (px), align?, bindings?:{<var>:{table, field?, aggregate?,
      format?, units?, compare?}}: with aggregate one value in format (with compare, as a card's: "+6.4%"); else a field's
      values, or without field the table's rows.
      {{ v }} · {{#list}}…{{/list}} repeats (or shows when set; inside {{field}} reads the row, {{.}} the item) ·
      {{^v}}…{{/v}} when empty ("—", a summary of no rows, is empty; a count is 0) · {{! comment }} · {{& v}} writes
      the value as Markdown (values are plain text otherwise). Unbound names: a table's rows (first 1000), title,
      page. Filters, chained: upper lower title truncate:n round:n format:"percent" date:"MMM d, yyyy" (yyyy yy MMMM
      MMM MM M dddd ddd dd d) default:"n/a" join:", " first first:n last size sort sort:"field" reverse, e.g.
      {{#sales | sort: "revenue" | reverse | first: 3}}- {{region}}{{/sales}}
  Measure  { name (unique in the report), table, format?, units? } and a summary { aggregate:Aggregate, field (not for count),
    where?: {field, values:["…"], table?} or a list of them (all must hold; table: a connected one) }, or a
    calculation { op:"+"|"-"|"*"|"/"|"pct-diff" ((a − b)/|b|), a:Operand, b:Operand }; Operand {measure, table?} |
    {field} (its sum) | {value}. Any connected visual uses it as "[name]" where a value goes; worked out per cell.
  Aggregate sum|avg|min|max|median|stdev|var|count (rows)|distinct|mode|first|last (non-blank). Single values (cards,
    bindings, table and matrix values) also take min/max/mode/first/last of text and dates.
  Value    { aggregate?:Aggregate (default sum), showAs?:"percent-of-total"|"running-total" (along the axis, matrix
    columns, else rows), compare?:Compare (per category or cell: a date axis or header moves too) }
  Compare  { shift?:"period"|"year" (the date filters, slicers' too, moved back), filters?:[Filter] (in place of
    those on the same fields), field? (another "[measure]"), show?:"change" (%, default)|"difference"|"value",
    label? (default "vs 2025 Q3"), invert? (lower is better) }
  Units    "auto"|"thousands"|"millions"|"billions": divided and suffixed, 2 decimals ($416.16B; integer: 1,094M)
  Format   Values (cards, bindings, table/matrix cells, gauge center) use the value's format and units, else its
    measure's (pct-diff measures: percent). None: a card uses "number"; a binding writes the raw number (for the
    round/format filters); table cells up to 3 decimals, matrix cells up to 2, in the viewer's locale.
    "number": under 1,000 as is, up to 2 decimals (999, 7.46, -182.50, 0.004); from 1,000 compact, 1 decimal (1.2K, 1.0M)
    "integer": rounded, viewer's locale (1,235; 0.336 → 0) · "percent": fraction ×100, 1 decimal (0.336 → 33.6%)
    "currency": US$, whole dollars from $100 ($1,235, -$183), cents below ($5.86, $5 when whole, $0.34)
    Units: ÷ and suffix, 2 decimals (integer: whole): $416.16B, 1,094M; auto = largest unit reached; percent ignores.
    Table "date"/"string": values as written. Charts: options.format, else the measure's format (not its units);
    axes compact ($50B), data labels 3 digits under 1,000 ($7.46, $225) else 1 decimal ($1.1B), options.units fixes
    one unit; tooltips exact ($416,161,000,000). Comparisons: change +6.4%, difference in the value's format
    (+$25.13B, +1.6%, +0.07), value unsigned; nothing to compare: "—". Other currencies: "number"/"integer" + title.
  DatePart "year"|"quarter"|"month"|"day"
  Filter   { field, table, values?:["…"] | min?, max? | from?, to? (ISO, inclusive) | last:{n, unit:"day"|"week"|"month"|
    "year"} | values + datePart ("2024 Q1") }. Reaches other tables through relationships; empty values = all.
  Theme    report only: { mode:"light"|"dark"|"auto", background, surface (tiles), text, muted, border, accent,
    palette:[8 colors], font, radius }
  -->
